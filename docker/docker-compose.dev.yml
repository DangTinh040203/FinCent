# Local development infrastructure — start with:
#   docker compose -f docker/docker-compose.dev.yml up -d
# The app itself runs on the host (`pnpm dev`); this only provides backing
# services. FinCent's backend has no DB wiring yet — these are ready-to-use
# scaffolding for when persistence/caching is added (point apps/be/.env at them).

name: fincent-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: fincent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fincent_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fincent_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fincent_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # Public tunnel to the host-run frontend (set NGROK_AUTHTOKEN in your env).
  # Inspector UI: http://localhost:4040
  ngrok:
    image: ngrok/ngrok:latest
    container_name: fincent_ngrok
    restart: unless-stopped
    command: http host.docker.internal:3001
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
